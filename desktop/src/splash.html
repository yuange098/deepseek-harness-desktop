<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        -webkit-app-region: drag; /* 无边框窗口整窗可拖动 */
        user-select: none;
      }
      /* 只留鲸鱼本体：黑色部分不变，白底已在 SVG 中去掉（透明） */
      .mark {
        width: 172px;
        height: 172px;
        display: block;
        filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.5));
      }
      .track {
        width: 216px;
        height: 7px;
        border-radius: 999px;
        background: rgba(150, 150, 150, 0.32);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        overflow: hidden;
      }
      .bar {
        width: 6%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4d6bfe, #22d3ee);
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  </head>
  <body>
    <img class="mark" src="whale-glyph.svg" alt="DeepSeek Harness" />
    <div class="track"><div class="bar" id="bar"></div></div>
    <script>
      const bar = document.getElementById('bar');
      let current = 0.06;
      window.setProgress = (value) => {
        const next = Math.min(1, Math.max(current, Number(value) || 0));
        current = next;
        bar.style.width = (next * 100).toFixed(1) + '%';
      };
      // 没有新信号时也让进度条往前爬，避免"卡住"的观感
      setTimeout(() => window.setProgress(0.28), 800);
      setTimeout(() => window.setProgress(0.44), 2400);
    </script>
  </body>
</html>
